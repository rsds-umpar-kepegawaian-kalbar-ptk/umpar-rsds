<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- Meminimalkan cache dokumen di browser -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Kepegawaian RSDS</title>

<style>
:root{
  --primary:#0f4c81;
  --primary-2:#1769aa;
  --primary-soft:#eaf4fb;
  --accent:#0f9f7f;
  --accent-soft:#e8f8f3;
  --bg:#f4f7fb;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --text:#172033;
  --muted:#667085;
  --line:#e5eaf0;
  --danger:#b42318;
  --shadow:0 14px 38px rgba(16,24,40,.08);
  --shadow-soft:0 7px 20px rgba(16,24,40,.06);
  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:14px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(23,105,170,.10), transparent 34%),
    radial-gradient(circle at bottom right, rgba(15,159,127,.08), transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter, "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input,a{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.hidden{
  display:none !important;
}

/* =========================
   APP WRAPPER
========================= */
.wrapper{
  width:min(1240px,100%);
  margin:0 auto;
  padding:18px;
  min-height:100vh;
}

/* =========================
   LOGIN
========================= */
.login-shell{
  min-height:calc(100vh - 36px);
  display:grid;
  place-items:center;
}

.login-card{
  width:min(460px,100%);
  background:rgba(255,255,255,.96);
  border:1px solid rgba(255,255,255,.9);
  border-radius:28px;
  box-shadow:0 22px 60px rgba(16,24,40,.12);
  overflow:hidden;
}

.login-top{
  padding:30px 30px 24px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  position:relative;
}

.login-top::after{
  content:"";
  width:170px;
  height:170px;
  border-radius:50%;
  position:absolute;
  right:-70px;
  top:-80px;
  background:rgba(255,255,255,.10);
}

.brand-row{
  display:flex;
  align-items:center;
  gap:13px;
  position:relative;
  z-index:1;
}

.brand-mark{
  width:50px;
  height:50px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);
  font-size:24px;
}

.brand-title{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.3px;
}

.brand-subtitle{
  margin-top:3px;
  font-size:13px;
  color:rgba(255,255,255,.82);
}

.login-body{
  padding:28px 30px 30px;
}

.login-heading{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.3px;
}

.login-note{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin-top:7px;
  margin-bottom:20px;
}

.field-label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

.input-wrap{
  position:relative;
}

.input-wrap input{
  width:100%;
  height:52px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--text);
  padding:0 16px;
  outline:none;
  transition:.18s ease;
}

.input-wrap input:focus{
  border-color:#84b9df;
  box-shadow:0 0 0 4px rgba(23,105,170,.10);
}

.login-btn{
  width:100%;
  min-height:52px;
  border:none;
  border-radius:14px;
  margin-top:14px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  font-weight:800;
  box-shadow:0 9px 20px rgba(15,76,129,.20);
  transition:.15s ease;
}

.login-btn:hover{
  transform:translateY(-1px);
}

.login-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.login-status{
  display:none;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
}

.login-status.show{
  display:flex;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid #d9e5ee;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================
   DASHBOARD
========================= */
#dashboard{
  display:none;
}

.dashboard-layout{
  display:block;
}

.sidebar{
  display:none;
}

.main-content{
  min-width:0;
}

.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:16px;
}

.header{
  min-width:0;
}

.eyebrow{
  color:var(--primary);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.10em;
  margin-bottom:5px;
}

.welcome{
  font-size:clamp(22px,3vw,30px);
  font-weight:850;
  letter-spacing:-.6px;
  line-height:1.15;
}

.nama-user{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
  overflow-wrap:anywhere;
}

/* MENU TITIK TIGA */
.top-menu{
  position:relative;
  z-index:50;
  flex:0 0 auto;
}

.menu-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:13px;
  background:var(--surface);
  display:grid;
  place-items:center;
  box-shadow:var(--shadow-soft);
  border:1px solid var(--line);
  font-size:21px;
  color:#344054;
}

.dropdown{
  display:none;
  position:absolute;
  right:0;
  top:48px;
  width:180px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.dropdown.show{
  display:block;
}

.dropdown button{
  width:100%;
  border:none;
  background:#fff;
  padding:12px 14px;
  text-align:left;
  color:#344054;
  font-size:13px;
}

.dropdown button:hover{
  background:var(--surface-2);
}

/* TABS MOBILE */
.tabs{
  display:flex;
  gap:7px;
  margin:0 0 14px;
  padding:5px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  overflow-x:auto;
  box-shadow:var(--shadow-soft);
}

.tab{
  flex:1 0 max-content;
  border:none;
  background:transparent;
  color:var(--muted);
  border-radius:11px;
  padding:10px 12px;
  font-size:12px;
  font-weight:750;
}

.tab.active{
  background:var(--primary-soft);
  color:var(--primary);
}

/* SLIDER */
.slider{
  display:flex;
  overflow:hidden;
  scroll-behavior:smooth;
}

.slide{
  min-width:100%;
  flex:0 0 100%;
}

/* SECTION HEAD */
.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.section-title{
  font-size:17px;
  font-weight:850;
  letter-spacing:-.2px;
}

.section-subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}

/* LAYANAN */
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}

.menu{
  min-height:120px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.97);
  border-radius:18px;
  padding:16px;
  text-align:left;
  cursor:pointer;
  transition:.16s ease;
  box-shadow:0 4px 14px rgba(16,24,40,.035);
}

.menu:hover{
  transform:translateY(-2px);
  border-color:#cfd9e3;
  box-shadow:var(--shadow-soft);
}

.menu-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:var(--primary-soft);
  font-size:21px;
  margin-bottom:13px;
}

.menu-title{
  font-size:14px;
  font-weight:800;
}

.menu-desc{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
}

/* RIWAYAT / ARSIP */
.riwayat-card{
  background:#fff;
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
  border:1px solid var(--line);
  box-shadow:0 4px 13px rgba(16,24,40,.035);
  font-size:13px;
}

.riwayat-card:hover{
  border-color:#d7dee7;
}

.riwayat-title{
  font-size:14px;
  font-weight:800;
  color:#263245;
}

.riwayat-date{
  margin-top:4px;
  margin-bottom:10px;
  font-size:11px;
  color:var(--muted);
}

.detail-row{
  display:grid;
  grid-template-columns:minmax(105px,145px) 1fr;
  gap:10px;
  padding:5px 0;
  line-height:1.45;
}

.detail-key{
  color:var(--muted);
  font-weight:650;
  overflow-wrap:anywhere;
}

.detail-val{
  color:#263245;
  overflow-wrap:anywhere;
}

.folder-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  color:var(--primary);
  text-decoration:none;
  font-weight:800;
  font-size:12px;
  padding:8px 10px;
  border-radius:10px;
  background:var(--primary-soft);
}

.folder-link:hover{
  filter:brightness(.98);
}

.empty-state{
  background:#fff;
  border:1px dashed #ccd5df;
  border-radius:18px;
  padding:34px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* SIDEBAR DESKTOP */
@media (min-width:1024px){
  .wrapper{
    padding:24px;
  }

  .dashboard-layout{
    display:grid;
    grid-template-columns:250px minmax(0,1fr);
    gap:24px;
  }

  .sidebar{
    display:block;
    position:sticky;
    top:24px;
    height:fit-content;
    background:#fff;
    border-radius:22px;
    padding:18px;
    border:1px solid var(--line);
    box-shadow:var(--shadow-soft);
  }

  .sidebar-brand{
    padding:6px 8px 18px;
    border-bottom:1px solid #eef1f4;
    margin-bottom:14px;
  }

  .sidebar-brand strong{
    display:block;
    color:var(--primary);
    font-size:16px;
  }

  .sidebar-brand span{
    display:block;
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
  }

  .sidebar h3{
    font-size:10px;
    margin:0 8px 9px;
    color:#98a2b3;
    text-transform:uppercase;
    letter-spacing:.12em;
  }

  .sidebar-item{
    width:100%;
    border:none;
    background:transparent;
    padding:11px 12px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:5px;
    font-size:13px;
    text-align:left;
    font-weight:700;
    color:#475467;
  }

  .sidebar-item.active,
  .sidebar-item:hover{
    background:var(--primary-soft);
    color:var(--primary);
  }

  .switch-user{
    width:100%;
    margin-top:13px;
    border:1px solid var(--line);
    background:#fff;
    color:#475467;
    padding:10px 12px;
    border-radius:12px;
    font-weight:700;
    font-size:12px;
  }

  .switch-user:hover{
    background:var(--surface-2);
  }

  .tabs{
    display:none;
  }

  .topbar{
    margin-top:4px;
  }

  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .menu{
    min-height:132px;
  }

}

@media (max-width:640px){
  .wrapper{
    padding:12px;
  }

  .login-shell{
    min-height:calc(100vh - 24px);
  }

  .login-card{
    border-radius:22px;
  }

  .login-top,
  .login-body{
    padding-left:21px;
    padding-right:21px;
  }

  .topbar{
    align-items:flex-start;
  }

  .grid{
    gap:9px;
  }

  .menu{
    min-height:112px;
    padding:14px;
  }

  .detail-row{
    grid-template-columns:1fr;
    gap:2px;
    padding:7px 0;
    border-bottom:1px solid #f0f2f5;
  }

  .detail-row:last-child{
    border-bottom:none;
  }
}

<body>
<div class="wrapper">

  <!-- LOGIN: tidak menyimpan NIP/NIK secara persisten di browser -->
  <section id="loginBox" class="login-shell">
    <div class="login-card">
      <div class="login-top">
        <div class="brand-row">
          <div class="brand-mark">🏥</div>
          <div>
            <div class="brand-title">Kepegawaian RSDS</div>
            <div class="brand-subtitle">Portal Layanan Pegawai</div>
          </div>
        </div>
      </div>

      <div class="login-body">
        <div class="login-heading">Masuk ke portal</div>
        <div class="login-note">
          Masukkan NIP / NIK untuk menampilkan pengajuan, catatan, dan berkas Anda.
          Data pengguna tidak disimpan di browser.
        </div>

        <label class="field-label" for="nip">NIP / NIK</label>
        <div class="input-wrap">
          <input
            id="nip"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Masukkan NIP / NIK"
            onkeydown="if(event.key==='Enter') login()"
          >
        </div>

        <button id="loginBtn" class="login-btn" onclick="login()">Masuk</button>

        <div id="loading" class="login-status">
          <div class="spinner"></div>
          <span>Memverifikasi data...</span>
        </div>
      </div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard">
    <div class="dashboard-layout">



      <main class="main-content">
        <div class="app-toolbar">
          <nav class="tabs" aria-label="Menu utama">
            <button class="tab active" onclick="goSlide(0)">Pengajuan &amp; Arsip</button>
            <button class="tab" onclick="goSlide(1)">Layanan</button>
          </nav>
          <div class="top-menu">
            <button class="menu-btn" onclick="toggleDropdown()" aria-label="Menu akun">⋮</button>
            <div class="dropdown" id="dropdown">
              <button id="identityToggle" onclick="toggleIdentity()" aria-expanded="false" aria-controls="identityPanel">Tampilkan identitas</button>
              <button onclick="logout()">Ganti NIP / NIK</button>
              <button onclick="logout()">Keluar</button>
            </div>
          </div>
        </div>
        <div class="identity-panel hidden" id="identityPanel">
          <div class="eyebrow">Portal Kepegawaian</div>
          <div class="welcome">Selamat Datang</div>
          <div class="nama-user" id="namaUser"></div>
        </div>

        <div class="slider" id="slider">
          <section class="slide" id="riwayatSlide"></section>
          <section class="slide hidden" id="layananSlide"></section>
        </div>
      </main>

    </div>
  </section>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyjYOjeXz2sJame1uf5sEjutY04B1RghTek5WmTbKb0qso_uJcLNjWoucbify9CvJ8m/exec";

let globalData = null;
let activeRequest = null;

/* =========================================================
   HELPER
========================================================= */
function safeText(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return safeText(value);
  return d.toLocaleDateString("id-ID",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function setLoading(state){
  const loading = document.getElementById("loading");
  const btn = document.getElementById("loginBtn");

  loading.classList.toggle("show", state);
  btn.disabled = state;
  const refresh = document.getElementById("refreshBtn");
  if(refresh){refresh.disabled = state; refresh.textContent = state ? "Memuat…" : "↻ Perbarui";}
  btn.textContent = state ? "Memproses..." : "Masuk";
}

function mapJudul(sheet, detail){
  const s = String(sheet || "").replace("data_","").toLowerCase();

  if(s==="pangkat") return "Pengajuan Pangkat";
  if(s==="kgb") return "Pengajuan Gaji Berkala";
  if(s==="cuti") return "Pengajuan Cuti";
  if(s==="ukom") return "Pengajuan UKOM";
  if(s==="jafung") return "Pengajuan Jabatan Fungsional";
  if(s==="sib_sip") return "Pengajuan SIP / SIB";
  if(s==="slks") return "Pengajuan SLKS";

  if(s==="arsip"){
    let jenis =
      detail?.["jenis-arsip"] ||
      detail?.["JENIS-ARSIP"] ||
      detail?.["jenis_arsip"] ||
      detail?.["JENIS_ARSIP"] ||
      "";

    if(String(jenis).includes(":")) jenis = String(jenis).split(":")[1];
    jenis = String(jenis).trim();

    return jenis ? "Arsip " + jenis : "Arsip";
  }

  return sheet || "Data";
}

/* =========================================================
   START
   Tidak ada auto-login dan tidak membaca sesi lama dari browser.
========================================================= */
window.addEventListener("load",()=>{
  document.getElementById("nip").value = "";
  document.getElementById("nip").focus();
});

document.addEventListener("click",(e)=>{
  const menu = document.querySelector(".top-menu");
  const dropdown = document.getElementById("dropdown");

  if(menu && !menu.contains(e.target)){
    dropdown.classList.remove("show");
  }
});

/* =========================================================
   LOGIN / FETCH TANPA CACHE
========================================================= */
function login(){
  const nip = document.getElementById("nip").value.trim();

  if(!nip){
    alert("Silakan masukkan NIP / NIK.");
    document.getElementById("nip").focus();
    return;
  }

  fetchData(nip);
}

async function fetchData(nip){
  if(activeRequest){
    activeRequest.abort();
  }

  const request = new AbortController();
  activeRequest = request;
  setLoading(true);

  try{
    /*
      _ts membuat URL unik setiap request.
      cache:"no-store" meminta browser tidak menyimpan/memakai cache request.
      NIP/NIK tidak disimpan secara persisten di browser.
    */
    const requestUrl = GAS_URL + "?_ts=" + Date.now();

    const response = await fetch(requestUrl,{
      method:"POST",
      cache:"no-store",
      redirect:"follow",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        nip:nip,
        _ts:Date.now()
      }),
      signal:request.signal
    });

    if(!response.ok) throw new Error("Server belum dapat dihubungi. Silakan coba kembali.");
    const raw = await response.text();
    if(activeRequest !== request) return;

    let result;
    try{
      result = JSON.parse(raw);
    }catch(err){
      console.error("Respons server tidak valid");
      throw new Error("Respons server tidak valid. Silakan coba lagi.");
    }

    if(!result.status){
      throw new Error(result.message || "NIP / NIK tidak ditemukan.");
    }

    globalData = result.data || {};

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    const profile = globalData.profile || {};
    const nama = profile.NAMA || profile.nama || "-";

    document.getElementById("namaUser").textContent = "Sdr/i " + nama;

    renderAll();
    goSlide(0);
    document.getElementById("refreshStatus").textContent = "Diperbarui " + new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});

    window.scrollTo({top:0,behavior:"auto"});
  }catch(err){
    if(err.name === "AbortError") return;

    console.error(err);
    alert(err.message || "Gagal terhubung ke server. Silakan coba kembali.");
  }finally{
    if(activeRequest === request){setLoading(false); activeRequest = null;}
  }
}

/* =========================================================
   RENDER SEMUA
========================================================= */
function renderAll(){
  renderLayanan();
  renderRiwayat();

}

/* =========================================================
   LAYANAN
========================================================= */
function renderLayanan(){
  document.getElementById("layananSlide").innerHTML = `
    <div class="section-head">
      <div>
        <div class="section-title">Layanan Kepegawaian</div>
        <div class="section-subtitle">Pilih layanan yang akan digunakan.</div>
      </div>
    </div>

    <div class="grid">
      <button type="button" class="menu" onclick="openUrl('https://rikoantah.github.io/pangkat-rsds-aktive/')">
        <div class="menu-icon">👤</div>
        <div class="menu-title">Pangkat</div>
        <div class="menu-desc">Layanan pengajuan pangkat.</div>
      </button>

      <button type="button" class="menu" onclick="openUrl('https://rikoantah.github.io/Gaji-Berkala-RSDS-Soedarso/')">
        <div class="menu-icon">💰</div>
        <div class="menu-title">Gaji Berkala</div>
        <div class="menu-desc">Pengajuan gaji berkala.</div>
      </button>

      <button type="button" class="menu" onclick="openUrl('https://rikoantah.github.io/Ukom-Rsds/')">
        <div class="menu-icon">📝</div>
        <div class="menu-title">UKOM</div>
        <div class="menu-desc">Layanan uji kompetensi.</div>
      </button>

      <button type="button" class="menu" onclick="openUrl('https://rikoantah.github.io/Jafung-D/')">
        <div class="menu-icon">💼</div>
        <div class="menu-title">Jabatan Fungsional</div>
        <div class="menu-desc">Layanan jabatan fungsional.</div>
      </button>

      <button type="button" class="menu" onclick="openUrl('https://rikoantahsaputra94-jpg.github.io/Tampilan-Cuti-Umpar/')">
        <div class="menu-icon">📅</div>
        <div class="menu-title">Cuti</div>
        <div class="menu-desc">Pengajuan layanan cuti.</div>
      </button>

      <button type="button" class="menu" onclick="openUrl('https://script.google.com/macros/s/AKfycbwqBTIpCs6qGOQJUioOHCftgomo9S_9dCA4TfwhsMR_SrdR2_svE0waIrisc3F325v3/exec')">
        <div class="menu-icon">🧮</div>
        <div class="menu-title">Angka Kredit</div>
        <div class="menu-desc">Layanan angka kredit.</div>
      </button>

      <button type="button" class="menu" onclick="openUrl('https://rikoantah.github.io/sip-sib/')">
        <div class="menu-icon">🪪</div>
        <div class="menu-title">SIP / SIB</div>
        <div class="menu-desc">Pengajuan SIP / SIB.</div>
      </button>

      <button type="button" class="menu" onclick="openUrl('https://rikoantah.github.io/slks-d/')">
        <div class="menu-icon">⭐</div>
        <div class="menu-title">SLKS</div>
        <div class="menu-desc">Layanan SLKS pegawai.</div>
      </button>
    </div>
  `;
}

/* =========================================================
   RIWAYAT PENGAJUAN
========================================================= */
function fieldKey(key){return String(key).toLowerCase().replace(/[^a-z0-9]/g, "");}
function meaningful(value){return value != null && String(value).trim() !== "" && String(value).trim() !== "-";}
function recordView(x){
  const detail = x.detail || {};
  const entries = Object.entries(detail);
  const archive = String(x.sheet || "").toLowerCase().replace(/^data_/, "") === "arsip";
  const find = names => entries.find(([k,v]) => names.includes(fieldKey(k)) && meaningful(v))?.[1];
  const kind = find(["jenispengajuan", "jenislayanan", "jenisarsip"]);
  const title = (kind ? String(kind) : mapJudul(x.sheet, detail)).replace(/^(Pengajuan|Arsip)\s+/i, "");
  const notes = entries.filter(([k,v]) => /catatan|keterangan|pesan|alasan/.test(fieldKey(k)) && meaningful(v));
  const status = find(["status", "statuspengajuan", "statusproses"]);
  const date = find(["timestamp", "tanggalpengajuan", "tanggal", "waktu"]);
  const links = [];
  entries.forEach(([key,value]) => {
    // Only complete HTTP(S) URLs become buttons; arbitrary text stays text.
    const raw = String(value ?? "").trim();
    try{
      const url = new URL(raw);
      if(!["https:","http:"].includes(url.protocol) || /\s/.test(raw)) return;
      if(links.some(link => link.url === url.href)) return;
      const folder = /\/folders\//i.test(url.pathname) || /folder/i.test(key);
      links.push({url:url.href, label:folder ? "Buka Folder Berkas" : "Buka Berkas", key});
    }catch(e){}
  });
  const sortValue = activityTime(date);
  return {title, notes, status, date, links, archive, sortValue};
}
function activityTime(value){
  if(!value) return null;
  const text = String(value).trim();
  const local = text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:[ ,T]+(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?)?$/);
  if(local){
    const [,day,month,year,hour="0",minute="0",second="0"] = local;
    const d = new Date(+year,+month-1,+day,+hour,+minute,+second);
    return d.getFullYear() === +year && d.getMonth() === +month-1 && d.getDate() === +day ? d.getTime() : null;
  }
  const n = Date.parse(text);
  return Number.isFinite(n) ? n : null;
}
function getVisibleRecords(query = "", category = "all"){
  const term = query.trim().toLocaleLowerCase("id-ID");
  return (Array.isArray(globalData?.riwayat) ? globalData.riwayat : []).map(recordView).sort((a,b) => (b.sortValue ?? -Infinity) - (a.sortValue ?? -Infinity)).filter(item => {
    const type = item.archive ? "arsip" : "pengajuan";
    const search = [type,item.title,item.status,...item.notes.map(note => note[1])].join(" ").toLocaleLowerCase("id-ID");
    return (category === "all" || category === type) && (!term || search.includes(term));
  });
}
function renderRiwayat(){
  const total = getVisibleRecords().length;
  document.getElementById("riwayatSlide").innerHTML = `
    <div class="table-tools"><label class="search-label" for="recordSearch">Cari pengajuan atau arsip<input id="recordSearch" type="search" placeholder="Ketik nama atau catatan…" oninput="renderRecordRows()"></label>
    <label class="filter-label" for="recordCategory">Jenis<select id="recordCategory" onchange="renderRecordRows()"><option value="all">Semua</option><option value="pengajuan">Pengajuan</option><option value="arsip">Arsip</option></select></label></div>
    <div class="table-summary"><p class="result-count" id="recordCount" role="status"></p><button class="refresh-compact" onclick="refreshData()" id="refreshBtn">↻ Perbarui</button></div><span id="refreshStatus" role="status" class="sr-only"></span>
    <div class="table-wrap"><table class="records-table" aria-label="Daftar pengajuan dan arsip"><colgroup><col class="col-no"><col class="col-kind"><col class="col-note"><col class="col-folder"></colgroup><thead><tr><th scope="col">No</th><th scope="col">Nama</th><th scope="col">Catatan</th><th scope="col">Berkas</th></tr></thead><tbody id="recordRows"></tbody></table></div>`;
  renderRecordRows();
}
function renderRecordRows(){
  const query = document.getElementById("recordSearch")?.value || "";
  const category = document.getElementById("recordCategory")?.value || "all";
  const rows = getVisibleRecords(query,category);
  document.getElementById("recordCount").textContent = rows.length + " data ditampilkan";
  document.getElementById("recordRows").innerHTML = rows.length ? rows.map((item,index) => {
    return `<tr><td class="row-number">${index+1}</td><td><div class="table-title">${safeText(item.title)}</div></td>
      <td>${item.status ? `<div class="table-status">Status: ${safeText(item.status)}</div>` : ""}${item.notes.length ? item.notes.map(([key,value]) => `<p class="table-note">${item.notes.length > 1 ? `<strong>${safeText(key)}: </strong>` : ""}${safeText(value)}</p>`).join("") : `<span class="muted">Belum ada catatan.</span>`}</td>
      <td>${item.links.length ? item.links.map(link => `<a class="table-open" href="${safeText(link.url)}" target="_blank" rel="noopener noreferrer" aria-label="${safeText(link.label + ': ' + item.title)}">Buka ↗<small>${link.label.includes("Folder") ? "Folder" : "Berkas"}</small></a>${item.links.length > 1 ? `<span class="link-caption">${safeText(link.key)}</span>` : ""}`).join("") : `<span class="unavailable">Belum tersedia</span>`}</td></tr>`;
  }).join("") : `<tr><td colspan="4" class="table-empty">${getVisibleRecords().length ? "Tidak ada data yang cocok. Coba kata lain atau pilih Semua." : `Belum ada pengajuan atau arsip.<button class="empty-service" onclick="goSlide(1)">Buka Layanan</button>`}</td></tr>`;
}
function refreshData(){
  const nip = document.getElementById("nip").value.trim();
  if(nip) fetchData(nip);
}
function goSlide(index){
  const i = index === 1 ? 1 : 0;
  document.querySelectorAll(".slide").forEach((el,idx) => el.classList.toggle("hidden",idx !== i));
  document.querySelectorAll(".tab,.sidebar-item").forEach(el => {
    const active = el.getAttribute("onclick") === `goSlide(${i})`;
    el.classList.toggle("active",active);
    el.setAttribute("aria-current",active ? "page" : "false");
  });
}

function openUrl(url){
  window.open(url,"_blank","noopener,noreferrer");
}

function toggleIdentity(){
  const panel = document.getElementById("identityPanel");
  const hidden = panel.classList.toggle("hidden");
  const btn = document.getElementById("identityToggle");
  btn.textContent = hidden ? "Tampilkan identitas" : "Sembunyikan identitas";
  btn.setAttribute("aria-expanded",String(!hidden));
  document.getElementById("dropdown").classList.remove("show");
}
function toggleDropdown(){
  document.getElementById("dropdown").classList.toggle("show");
}

/* =========================================================
   GANTI PENGGUNA / LOGOUT
   Tidak menghapus cache karena memang tidak ada data pengguna
   yang disimpan secara persisten di browser.
========================================================= */
function logout(){
  if(activeRequest){
    activeRequest.abort();
    activeRequest = null;
  }

  globalData = null;
  document.getElementById("identityPanel").classList.add("hidden");
  document.getElementById("identityToggle").textContent = "Tampilkan identitas";
  document.getElementById("identityToggle").setAttribute("aria-expanded","false");

  document.getElementById("dropdown").classList.remove("show");
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginBox").style.display = "grid";
  document.getElementById("layananSlide").innerHTML = "";
  document.getElementById("riwayatSlide").innerHTML = "";

  document.getElementById("namaUser").textContent = "";
  document.getElementById("nip").value = "";

  setLoading(false);

  window.scrollTo({top:0,behavior:"auto"});
  setTimeout(()=>document.getElementById("nip").focus(),50);
}
</script>

</body>
</html>
