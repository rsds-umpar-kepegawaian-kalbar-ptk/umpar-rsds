<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- Meminimalkan cache dokumen di browser -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Kepegawaian RSDS</title>

<style>
:root{
  --primary:#0f4c81;
  --primary-2:#1769aa;
  --primary-soft:#eaf4fb;
  --accent:#0f9f7f;
  --accent-soft:#e8f8f3;
  --bg:#f4f7fb;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --text:#172033;
  --muted:#667085;
  --line:#e5eaf0;
  --danger:#b42318;
  --shadow:0 14px 38px rgba(16,24,40,.08);
  --shadow-soft:0 7px 20px rgba(16,24,40,.06);
  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:14px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(23,105,170,.10), transparent 34%),
    radial-gradient(circle at bottom right, rgba(15,159,127,.08), transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter, "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input,a{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.hidden{
  display:none !important;
}

/* =========================
   APP WRAPPER
========================= */
.wrapper{
  width:min(1240px,100%);
  margin:0 auto;
  padding:18px;
  min-height:100vh;
}

/* =========================
   LOGIN
========================= */
.login-shell{
  min-height:calc(100vh - 36px);
  display:grid;
  place-items:center;
}

.login-card{
  width:min(460px,100%);
  background:rgba(255,255,255,.96);
  border:1px solid rgba(255,255,255,.9);
  border-radius:28px;
  box-shadow:0 22px 60px rgba(16,24,40,.12);
  overflow:hidden;
}

.login-top{
  padding:30px 30px 24px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  position:relative;
}

.login-top::after{
  content:"";
  width:170px;
  height:170px;
  border-radius:50%;
  position:absolute;
  right:-70px;
  top:-80px;
  background:rgba(255,255,255,.10);
}

.brand-row{
  display:flex;
  align-items:center;
  gap:13px;
  position:relative;
  z-index:1;
}

.brand-mark{
  width:50px;
  height:50px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);
  font-size:24px;
}

.brand-title{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.3px;
}

.brand-subtitle{
  margin-top:3px;
  font-size:13px;
  color:rgba(255,255,255,.82);
}

.login-body{
  padding:28px 30px 30px;
}

.login-heading{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.3px;
}

.login-note{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin-top:7px;
  margin-bottom:20px;
}

.field-label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

.input-wrap{
  position:relative;
}

.input-wrap input{
  width:100%;
  height:52px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--text);
  padding:0 16px;
  outline:none;
  transition:.18s ease;
}

.input-wrap input:focus{
  border-color:#84b9df;
  box-shadow:0 0 0 4px rgba(23,105,170,.10);
}

.login-btn{
  width:100%;
  min-height:52px;
  border:none;
  border-radius:14px;
  margin-top:14px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  font-weight:800;
  box-shadow:0 9px 20px rgba(15,76,129,.20);
  transition:.15s ease;
}

.login-btn:hover{
  transform:translateY(-1px);
}

.login-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.login-status{
  display:none;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
}

.login-status.show{
  display:flex;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid #d9e5ee;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================
   DASHBOARD
========================= */
#dashboard{
  display:none;
}

.dashboard-layout{
  display:block;
}

.sidebar{
  display:none;
}

.main-content{
  min-width:0;
}

.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:16px;
}

.header{
  min-width:0;
}

.eyebrow{
  color:var(--primary);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.10em;
  margin-bottom:5px;
}

.welcome{
  font-size:clamp(22px,3vw,30px);
  font-weight:850;
  letter-spacing:-.6px;
  line-height:1.15;
}

.nama-user{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
  overflow-wrap:anywhere;
}

/* MENU TITIK TIGA */
.top-menu{
  position:relative;
  z-index:50;
  flex:0 0 auto;
}

.menu-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:13px;
  background:var(--surface);
  display:grid;
  place-items:center;
  box-shadow:var(--shadow-soft);
  border:1px solid var(--line);
  font-size:21px;
  color:#344054;
}

.dropdown{
  display:none;
  position:absolute;
  right:0;
  top:48px;
  width:180px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.dropdown.show{
  display:block;
}

.dropdown button{
  width:100%;
  border:none;
  background:#fff;
  padding:12px 14px;
  text-align:left;
  color:#344054;
  font-size:13px;
}

.dropdown button:hover{
  background:var(--surface-2);
}

/* MESSAGE */
.message-panel{
  margin-bottom:14px;
}

.message-header{
  width:100%;
  border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  padding:14px 16px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  text-align:left;
  box-shadow:0 9px 22px rgba(15,76,129,.12);
}

.message-title{
  font-size:14px;
  font-weight:800;
}

.message-count{
  min-width:26px;
  height:26px;
  padding:0 8px;
  border-radius:999px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.18);
  font-size:12px;
  font-weight:800;
}

.message-box{
  display:none;
  margin-top:8px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:6px 14px;
  max-height:230px;
  overflow:auto;
  box-shadow:var(--shadow-soft);
}

.message-box.show{
  display:block;
}

.message-card{
  padding:12px 0;
  border-bottom:1px solid #eef1f4;
  font-size:13px;
  line-height:1.55;
}

.message-card:last-child{
  border-bottom:none;
}

.message-time{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

/* TABS MOBILE */
.tabs{
  display:flex;
  gap:7px;
  margin:0 0 14px;
  padding:5px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  overflow-x:auto;
  box-shadow:var(--shadow-soft);
}

.tab{
  flex:1 0 max-content;
  border:none;
  background:transparent;
  color:var(--muted);
  border-radius:11px;
  padding:10px 12px;
  font-size:12px;
  font-weight:750;
}

.tab.active{
  background:var(--primary-soft);
  color:var(--primary);
}

/* SLIDER */
.slider{
  display:flex;
  overflow:hidden;
  scroll-behavior:smooth;
}

.slide{
  min-width:100%;
  flex:0 0 100%;
}

/* SECTION HEAD */
.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.section-title{
  font-size:17px;
  font-weight:850;
  letter-spacing:-.2px;
}

.section-subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}

/* LAYANAN */
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}

.menu{
  min-height:120px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.97);
  border-radius:18px;
  padding:16px;
  text-align:left;
  cursor:pointer;
  transition:.16s ease;
  box-shadow:0 4px 14px rgba(16,24,40,.035);
}

.menu:hover{
  transform:translateY(-2px);
  border-color:#cfd9e3;
  box-shadow:var(--shadow-soft);
}

.menu-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:var(--primary-soft);
  font-size:21px;
  margin-bottom:13px;
}

.menu-title{
  font-size:14px;
  font-weight:800;
}

.menu-desc{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
}

/* RIWAYAT / ARSIP */
.riwayat-card{
  background:#fff;
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
  border:1px solid var(--line);
  box-shadow:0 4px 13px rgba(16,24,40,.035);
  font-size:13px;
}

.riwayat-card:hover{
  border-color:#d7dee7;
}

.riwayat-title{
  font-size:14px;
  font-weight:800;
  color:#263245;
}

.riwayat-date{
  margin-top:4px;
  margin-bottom:10px;
  font-size:11px;
  color:var(--muted);
}

.detail-row{
  display:grid;
  grid-template-columns:minmax(105px,145px) 1fr;
  gap:10px;
  padding:5px 0;
  line-height:1.45;
}

.detail-key{
  color:var(--muted);
  font-weight:650;
  overflow-wrap:anywhere;
}

.detail-val{
  color:#263245;
  overflow-wrap:anywhere;
}

.folder-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  color:var(--primary);
  text-decoration:none;
  font-weight:800;
  font-size:12px;
  padding:8px 10px;
  border-radius:10px;
  background:var(--primary-soft);
}

.folder-link:hover{
  filter:brightness(.98);
}

.empty-state{
  background:#fff;
  border:1px dashed #ccd5df;
  border-radius:18px;
  padding:34px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* PROFIL */
.profil-card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  border:1px solid var(--line);
  box-shadow:0 5px 16px rgba(16,24,40,.04);
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.profile-item{
  padding:13px 14px;
  border-radius:14px;
  background:var(--surface-2);
  border:1px solid #eef1f4;
}

.profile-label{
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:4px;
}

.profile-value{
  font-size:13px;
  font-weight:650;
  overflow-wrap:anywhere;
}

.profile-note{
  margin-top:14px;
  padding:12px 13px;
  border-radius:13px;
  background:#fff4f2;
  color:var(--danger);
  font-size:12px;
  line-height:1.5;
}

.update-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:12px;
  min-height:44px;
  padding:10px 14px;
  background:var(--primary);
  color:#fff;
  border-radius:12px;
  text-decoration:none;
  font-weight:800;
  font-size:13px;
}

/* SIDEBAR DESKTOP */
@media (min-width:1024px){
  .wrapper{
    padding:24px;
  }

  .dashboard-layout{
    display:grid;
    grid-template-columns:250px minmax(0,1fr);
    gap:24px;
  }

  .sidebar{
    display:block;
    position:sticky;
    top:24px;
    height:fit-content;
    background:#fff;
    border-radius:22px;
    padding:18px;
    border:1px solid var(--line);
    box-shadow:var(--shadow-soft);
  }

  .sidebar-brand{
    padding:6px 8px 18px;
    border-bottom:1px solid #eef1f4;
    margin-bottom:14px;
  }

  .sidebar-brand strong{
    display:block;
    color:var(--primary);
    font-size:16px;
  }

  .sidebar-brand span{
    display:block;
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
  }

  .sidebar h3{
    font-size:10px;
    margin:0 8px 9px;
    color:#98a2b3;
    text-transform:uppercase;
    letter-spacing:.12em;
  }

  .sidebar-item{
    width:100%;
    border:none;
    background:transparent;
    padding:11px 12px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:5px;
    font-size:13px;
    text-align:left;
    font-weight:700;
    color:#475467;
  }

  .sidebar-item.active,
  .sidebar-item:hover{
    background:var(--primary-soft);
    color:var(--primary);
  }

  .switch-user{
    width:100%;
    margin-top:13px;
    border:1px solid var(--line);
    background:#fff;
    color:#475467;
    padding:10px 12px;
    border-radius:12px;
    font-weight:700;
    font-size:12px;
  }

  .switch-user:hover{
    background:var(--surface-2);
  }

  .tabs{
    display:none;
  }

  .topbar{
    margin-top:4px;
  }

  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .menu{
    min-height:132px;
  }

  .profile-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media (max-width:640px){
  .wrapper{
    padding:12px;
  }

  .login-shell{
    min-height:calc(100vh - 24px);
  }

  .login-card{
    border-radius:22px;
  }

  .login-top,
  .login-body{
    padding-left:21px;
    padding-right:21px;
  }

  .topbar{
    align-items:flex-start;
  }

  .grid{
    gap:9px;
  }

  .menu{
    min-height:112px;
    padding:14px;
  }

  .detail-row{
    grid-template-columns:1fr;
    gap:2px;
    padding:7px 0;
    border-bottom:1px solid #f0f2f5;
  }

  .detail-row:last-child{
    border-bottom:none;
  }
}
</style>
</head>

<body>
<div class="wrapper">

  <!-- LOGIN: tidak menyimpan NIP/NIK secara persisten di browser -->
  <section id="loginBox" class="login-shell">
    <div class="login-card">
      <div class="login-top">
        <div class="brand-row">
          <div class="brand-mark">🏥</div>
          <div>
            <div class="brand-title">Kepegawaian RSDS</div>
            <div class="brand-subtitle">Portal Layanan Pegawai</div>
          </div>
        </div>
      </div>

      <div class="login-body">
        <div class="login-heading">Masuk ke portal</div>
        <div class="login-note">
          Masukkan NIP / NIK untuk menampilkan layanan, pengajuan, arsip, dan profil pegawai.
          Data pengguna tidak disimpan di browser.
        </div>

        <label class="field-label" for="nip">NIP / NIK</label>
        <div class="input-wrap">
          <input
            id="nip"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Masukkan NIP / NIK"
            onkeydown="if(event.key==='Enter') login()"
          >
        </div>

        <button id="loginBtn" class="login-btn" onclick="login()">Masuk</button>

        <div id="loading" class="login-status">
          <div class="spinner"></div>
          <span>Memverifikasi data...</span>
        </div>
      </div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard">
    <div class="dashboard-layout">

      <aside class="sidebar" id="sidebarMenu">
        <div class="sidebar-brand">
          <strong>Kepegawaian RSDS</strong>
          <span>Portal layanan pegawai</span>
        </div>

        <h3>Menu Utama</h3>
        <button class="sidebar-item active" onclick="goSlide(0)">Layanan</button>
        <button class="sidebar-item" onclick="goSlide(1)">Pengajuan</button>
        <button class="sidebar-item" onclick="goSlide(2)">Arsip Dokumen</button>
        <button class="sidebar-item" onclick="goSlide(3)">Profil</button>

        <button class="switch-user" onclick="logout()">Ganti NIP / NIK</button>
      </aside>

      <main class="main-content">
        <div class="topbar">
          <div class="header">
            <div class="eyebrow">Portal Kepegawaian</div>
            <div class="welcome">Selamat Datang</div>
            <div class="nama-user" id="namaUser"></div>
          </div>

          <div class="top-menu">
            <button class="menu-btn" onclick="toggleDropdown()" aria-label="Menu">⋮</button>
            <div class="dropdown" id="dropdown">
              <button onclick="logout()">Ganti NIP / NIK</button>
              <button onclick="logout()">Keluar Aplikasi</button>
            </div>
          </div>
        </div>

        <div id="messageContainer"></div>

        <div class="tabs">
          <button class="tab active" onclick="goSlide(0)">Layanan</button>
          <button class="tab" onclick="goSlide(1)">Pengajuan</button>
          <button class="tab" onclick="goSlide(2)">Arsip</button>
          <button class="tab" onclick="goSlide(3)">Profil</button>
        </div>

        <div class="slider" id="slider">
          <section class="slide" id="layananSlide"></section>
          <section class="slide" id="riwayatSlide"></section>
          <section class="slide" id="arsipSlide"></section>
          <section class="slide" id="profilSlide"></section>
        </div>
      </main>

    </div>
  </section>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyjYOjeXz2sJame1uf5sEjutY04B1RghTek5WmTbKb0qso_uJcLNjWoucbify9CvJ8m/exec";

let globalData = null;
let activeRequest = null;

/* =========================================================
   HELPER
========================================================= */
function safeText(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return safeText(value);
  return d.toLocaleDateString("id-ID",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function setLoading(state){
  const loading = document.getElementById("loading");
  const btn = document.getElementById("loginBtn");

  loading.classList.toggle("show", state);
  btn.disabled = state;
  btn.textContent = state ? "Memproses..." : "Masuk";
}

function mapJudul(sheet, detail){
  const s = String(sheet || "").replace("data_","").toLowerCase();

  if(s==="pangkat") return "Pengajuan Pangkat";
  if(s==="kgb") return "Pengajuan Gaji Berkala";
  if(s==="cuti") return "Pengajuan Cuti";
  if(s==="ukom") return "Pengajuan UKOM";
  if(s==="jafung") return "Pengajuan Jabatan Fungsional";
  if(s==="sib_sip") return "Pengajuan SIP / SIB";
  if(s==="slks") return "Pengajuan SLKS";

  if(s==="arsip"){
    let jenis =
      detail?.["jenis-arsip"] ||
      detail?.["JENIS-ARSIP"] ||
      detail?.["jenis_arsip"] ||
      detail?.["JENIS_ARSIP"] ||
      "";

    if(String(jenis).includes(":")) jenis = String(jenis).split(":")[1];
    jenis = String(jenis).trim();

    return jenis ? "Arsip " + jenis : "Arsip";
  }

  return sheet || "Data";
}

/* =========================================================
   START
   Tidak ada auto-login dan tidak membaca sesi lama dari browser.
========================================================= */
window.addEventListener("load",()=>{
  document.getElementById("nip").value = "";
  document.getElementById("nip").focus();
});

document.addEventListener("click",(e)=>{
  const menu = document.querySelector(".top-menu");
  const dropdown = document.getElementById("dropdown");

  if(menu && !menu.contains(e.target)){
    dropdown.classList.remove("show");
  }
});

/* =========================================================
   LOGIN / FETCH TANPA CACHE
========================================================= */
function login(){
  const nip = document.getElementById("nip").value.trim();

  if(!nip){
    alert("Silakan masukkan NIP / NIK.");
    document.getElementById("nip").focus();
    return;
  }

  fetchData(nip);
}

async function fetchData(nip){
  if(activeRequest){
    activeRequest.abort();
  }

  activeRequest = new AbortController();
  setLoading(true);

  try{
    /*
      _ts membuat URL unik setiap request.
      cache:"no-store" meminta browser tidak menyimpan/memakai cache request.
      NIP/NIK tidak disimpan secara persisten di browser.
    */
    const requestUrl = GAS_URL + "?_ts=" + Date.now();

    const response = await fetch(requestUrl,{
      method:"POST",
      cache:"no-store",
      redirect:"follow",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        nip:nip,
        _ts:Date.now()
      }),
      signal:activeRequest.signal
    });

    const raw = await response.text();

    let result;
    try{
      result = JSON.parse(raw);
    }catch(err){
      console.error("Respons server:", raw);
      throw new Error("Respons server tidak valid. Silakan coba lagi.");
    }

    if(!result.status){
      throw new Error(result.message || "NIP / NIK tidak ditemukan.");
    }

    globalData = result.data || {};

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    const profile = globalData.profile || {};
    const nama = profile.NAMA || profile.nama || "-";

    document.getElementById("namaUser").textContent = "Sdr/i " + nama;

    renderAll();
    goSlide(0);

    window.scrollTo({top:0,behavior:"auto"});
  }catch(err){
    if(err.name === "AbortError") return;

    console.error(err);
    alert(err.message || "Gagal terhubung ke server. Silakan coba kembali.");
  }finally{
    setLoading(false);
    activeRequest = null;
  }
}

/* =========================================================

========================================================= */
function renderRiwayat(){
  const riwayat = Array.isArray(globalData?.riwayat) ? globalData.riwayat : [];
  const data = riwayat.filter(x=>x.sheet !== "data_arsip");

  let html = `
    <div class="section-head">
      <div>
        <div class="section-title">Riwayat Pengajuan</div>
        <div class="section-subtitle">Data pengajuan pegawai yang tersimpan.</div>
      </div>
    </div>
  `;

  if(!data.length){
    html += `<div class="empty-state">Belum ada pengajuan.</div>`;
    document.getElementById("riwayatSlide").innerHTML = html;
    return;
  }

  data.forEach(x=>{
    const detail = x.detail || {};
    const judul = mapJudul(x.sheet, detail);
    const tanggal = detail.TIMESTAMP ? formatDate(detail.TIMESTAMP) : "";

    html += `
      <article class="riwayat-card">
        <div class="riwayat-title">${safeText(judul)}</div>
        ${tanggal ? `<div class="riwayat-date">${safeText(tanggal)}</div>` : ""}
    `;

    Object.entries(detail).forEach(([k,originalValue])=>{
      const key = String(k);
      const low = key.toLowerCase();

      if(low === "nama" || low === "nip" || key === "TIMESTAMP") return;

      let value = originalValue ?? "";

      if(String(value).startsWith("http")){
        html += `
          <div>
            <a href="${safeText(value)}" target="_blank" rel="noopener noreferrer" class="folder-link">
              📂 Buka Folder
            </a>
          </div>
        `;
        return;
      }

      if(typeof value === "string" && value.includes("T") && value.includes("Z")){
        value = formatDate(value);
      }

      html += `
        <div class="detail-row">
          <div class="detail-key">${safeText(key)}</div>
          <div class="detail-val">${safeText(value || "-")}</div>
        </div>
      `;
    });

    html += `</article>`;
  });

  document.getElementById("riwayatSlide").innerHTML = html;
}

/* =========================================================
   ARSIP
========================================================= */
function renderArsip(){
  const riwayat = Array.isArray(globalData?.riwayat) ? globalData.riwayat : [];
  const arsip = riwayat.filter(x=>x.sheet === "data_arsip");

  let html = `
    <div class="section-head">
      <div>
        <div class="section-title">Arsip Dokumen</div>
        <div class="section-subtitle">Dokumen arsip pegawai yang tersedia.</div>
      </div>
    </div>
  `;

  if(!arsip.length){
    html += `<div class="empty-state">Belum ada arsip.</div>`;
    document.getElementById("arsipSlide").innerHTML = html;
    return;
  }

  arsip.forEach(x=>{
    const detail = x.detail || {};
    const judul = mapJudul(x.sheet, detail);

    let fileUrl = "";

    Object.values(detail).forEach(val=>{
      const value = String(val || "");
      if(value.includes("drive.google.com/file")){
        fileUrl = value;
      }
    });

    let download = "";

    if(fileUrl){
      const match = fileUrl.match(/\/d\/(.*?)\//);
      const fileId = match ? match[1] : null;

      if(fileId){
        const url = "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(fileId);
        download = `
          <a href="${safeText(url)}" target="_blank" rel="noopener noreferrer" class="folder-link">
            ⬇ Download
          </a>
        `;
      }
    }

    html += `
      <article class="riwayat-card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div class="riwayat-title">${safeText(judul)}</div>
          <div>${download}</div>
        </div>
      </article>
    `;
  });

  document.getElementById("arsipSlide").innerHTML = html;
}

/* =========================================================

========================================================= */
function goSlide(index){
  const slider = document.getElementById("slider");
  const maxIndex = 3;
  const i = Math.max(0,Math.min(index,maxIndex));

  slider.scrollTo({
    left:i * slider.clientWidth,
    behavior:"smooth"
  });

  document.querySelectorAll(".tab").forEach((el,idx)=>{
    el.classList.toggle("active",idx===i);
  });

  document.querySelectorAll(".sidebar-item").forEach((el,idx)=>{
    el.classList.toggle("active",idx===i);
  });
}

   yang disimpan secara persisten di browser.
========================================================= */
function logout(){
  if(activeRequest){
    activeRequest.abort();
    activeRequest = null;
  }

  globalData = null;

  document.getElementById("dropdown").classList.remove("show");
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginBox").style.display = "grid";
  document.getElementById("messageContainer").innerHTML = "";
  document.getElementById("layananSlide").innerHTML = "";
  document.getElementById("riwayatSlide").innerHTML = "";
  document.getElementById("arsipSlide").innerHTML = "";
  document.getElementById("profilSlide").innerHTML = "";
  document.getElementById("namaUser").textContent = "";
  document.getElementById("nip").value = "";

  setLoading(false);

  window.scrollTo({top:0,behavior:"auto"});
  setTimeout(()=>document.getElementById("nip").focus(),50);
}
